function Tooltip({ text, x, y }) {

function BarChart({ data, xKey, yKey, color='#6366f1', label='', height=220, formatY=v=>v.toFixed(3), referenceY, refLabel }) {
  const [tip, setTip] = useState(null);
  const svgRef = useRef();
  const W=600, H=height, PL=50, PR=20, PT=20, PB=40;
  const cw=W-PL-PR, ch=H-PT-PB;
  const maxY = Math.max(...data.map(d=>d[yKey]))*1.12;
  const minY = referenceY ? Math.min(referenceY*0.97, Math.min(...data.map(d=>d[yKey]))*0.97) : Math.min(...data.map(d=>d[yKey]))*0.97;
  const bw = cw/data.length*0.65;
  const scaleY = v => ch - ((v-minY)/(maxY-minY))*ch;
  const bars = data.map((d,i) => {
    const x = PL + (i+0.5)*cw/data.length - bw/2;
    const y = PT + scaleY(d[yKey]);
    const bh = ch - scaleY(d[yKey]);
    return {x, y, bh, d, i};
  });
  const nTicks = 5;
  const ticks = Array.from({length:nTicks+1},(_,i)=>minY+(maxY-minY)*i/nTicks);
  return (
    <div className="relative">
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full" style={{maxHeight:height+20}}>
        {ticks.map((t,i)=>(
          <g key={i}>
            <line x1={PL} x2={W-PR} y1={PT+scaleY(t)} y2={PT+scaleY(t)} stroke="#2d3154" strokeWidth="1"/>
            <text x={PL-6} y={PT+scaleY(t)+4} textAnchor="end" fontSize="10" fill="#64748b">{formatY(t)}</text>
          </g>
        ))}
        {referenceY && (
          <g>
            <line x1={PL} x2={W-PR} y1={PT+scaleY(referenceY)} y2={PT+scaleY(referenceY)} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="5,3"/>
            <text x={W-PR-2} y={PT+scaleY(referenceY)-4} textAnchor="end" fontSize="10" fill="#ef4444">{refLabel||formatY(referenceY)}</text>
          </g>
        )}
        {bars.map(({x,y,bh,d,i})=>(
          <rect key={i} x={x} y={y} width={bw} height={bh} fill={color} rx="3" opacity="0.85"
            onMouseEnter={e=>{const r=svgRef.current.getBoundingClientRect(); setTip({text:`${d[xKey]}: ${formatY(d[yKey])}`,x:e.clientX-r.left,y:e.clientY-r.top});}}
            onMouseLeave={()=>setTip(null)} style={{cursor:'pointer'}}/>
        ))}
        {bars.map(({x,d,i})=>(
          <text key={i} x={x+bw/2} y={H-PB+14} textAnchor="middle" fontSize="10" fill="#64748b">{d[xKey]}</text>
        ))}
        {label && <text x={W/2} y={H-2} textAnchor="middle" fontSize="11" fill="#64748b">{label}</text>}
        <text x={14} y={PT+ch/2} textAnchor="middle" fontSize="10" fill="#64748b" transform={`rotate(-90,14,${PT+ch/2})`}>C-index</text>
      </svg>
      {tip && <div className="tooltip" style={{left:tip.x+12,top:tip.y}}>{tip.text}</div>}
    </div>
  );
}

function GroupedBarChart({ data, groups, colors, height=260, formatY=v=>v.toFixed(3), yLabel='' }) {
  const [tip, setTip] = useState(null);
  const svgRef = useRef();
  const W=680, H=height, PL=52, PR=20, PT=20, PB=50;
  const cw=W-PL-PR, ch=H-PT-PB;
  const allVals = data.flatMap(d=>groups.map(g=>d[g]));
  const maxY = Math.max(...allVals)*1.12;
  const minY = Math.min(...allVals)*0.95;
  const bw = cw/data.length/(groups.length+1)*0.9;
  const scaleY = v=>ch-((v-minY)/(maxY-minY))*ch;
  const nTicks=5;
  const ticks=Array.from({length:nTicks+1},(_,i)=>minY+(maxY-minY)*i/nTicks);
  return (
    <div className="relative">
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full" style={{maxHeight:height+30}}>
        {ticks.map((t,i)=>(
          <g key={i}>
            <line x1={PL} x2={W-PR} y1={PT+scaleY(t)} y2={PT+scaleY(t)} stroke="#2d3154" strokeWidth="1"/>
            <text x={PL-6} y={PT+scaleY(t)+4} textAnchor="end" fontSize="10" fill="#64748b">{formatY(t)}</text>
          </g>
        ))}
        {data.map((d,i)=>groups.map((g,j)=>{
          const slotW=cw/data.length;
          const x=PL+i*slotW+(j*(bw+2))+slotW*0.1;
          const y=PT+scaleY(d[g]);
          const bh=ch-scaleY(d[g]);
          return (
            <rect key={`${i}-${j}`} x={x} y={y} width={bw} height={bh} fill={colors[j]} rx="2" opacity="0.85"
              onMouseEnter={e=>{const r=svgRef.current.getBoundingClientRect();setTip({text:`${d.feature} | ${g.toUpperCase()}: ${formatY(d[g])}`,x:e.clientX-r.left,y:e.clientY-r.top});}}
              onMouseLeave={()=>setTip(null)} style={{cursor:'pointer'}}/>
          );
        }))}
        {data.map((d,i)=>{
          const slotW=cw/data.length;
          const x=PL+i*slotW+slotW/2;
          return <text key={i} x={x} y={H-PB+14} textAnchor="middle" fontSize="10" fill="#94a3b8">{d.feature}</text>;
        })}
        {groups.map((g,j)=>(
          <g key={j}>
            <rect x={PL+(j*80)} y={H-PB+28} width="12" height="10" fill={colors[j]} rx="2"/>
            <text x={PL+(j*80)+16} y={H-PB+37} fontSize="11" fill="#94a3b8">{g.toUpperCase()}</text>
          </g>
        ))}
        {yLabel && <text x={14} y={PT+ch/2} textAnchor="middle" fontSize="10" fill="#64748b" transform={`rotate(-90,14,${PT+ch/2})`}>{yLabel}</text>}
      </svg>
      {tip && <div className="tooltip" style={{left:tip.x+12,top:tip.y}}>{tip.text}</div>}
    </div>
  );
}

  const xs=data.map(d=>d[xKey]), ys=data.map(d=>d[yKey]);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const sx=v=>PL+(v-minX)/(maxX-minX+0.001)*cw;
  const sy=v=>PT+ch-(v-minY)/(maxY-minY+0.001)*ch;
  const nX=5, nY=5;
  const xTicks=Array.from({length:nX+1},(_,i)=>minX+(maxX-minX)*i/nX);
  const yTicks=Array.from({length:nY+1},(_,i)=>minY+(maxY-minY)*i/nY);
  return (
    <div className="relative">
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full" style={{maxHeight:height+30}}>
        {yTicks.map((t,i)=>(
          <g key={i}>
            <line x1={PL} x2={W-PR} y1={sy(t)} y2={sy(t)} stroke="#2d3154" strokeWidth="1"/>
            <text x={PL-6} y={sy(t)+4} textAnchor="end" fontSize="10" fill="#64748b">{t.toFixed(2)}</text>
          </g>
        ))}
        {xTicks.map((t,i)=>(
          <g key={i}>
            <line x1={sx(t)} x2={sx(t)} y1={PT} y2={PT+ch} stroke="#2d3154" strokeWidth="1"/>
            <text x={sx(t)} y={PT+ch+14} textAnchor="middle" fontSize="10" fill="#64748b">{t.toFixed(2)}</text>
          </g>
        ))}
        {data.map((d,i)=>(
          <g key={i}>
            <circle cx={sx(d[xKey])} cy={sy(d[yKey])} r={Math.max(6,d.avgShap*30)} fill={d[colorKey]||'#6366f1'}
              opacity="0.75" style={{cursor:'pointer'}}
              onMouseEnter={e=>{const r=svgRef.current.getBoundingClientRect();setTip({text:tipFn?tipFn(d):`${d[labelKey]}: SHAP=${d[yKey].toFixed(3)} Var=${d[xKey].toFixed(3)}`,x:e.clientX-r.left,y:e.clientY-r.top});}}
              onMouseLeave={()=>setTip(null)}/>
            <text x={sx(d[xKey])} y={sy(d[yKey])-Math.max(6,d.avgShap*30)-3} textAnchor="middle" fontSize="10" fill="#e2e8f0">{d[labelKey]}</text>
          </g>
        ))}
        <text x={W/2} y={H-4} textAnchor="middle" fontSize="11" fill="#64748b">Variance Explained</text>
        <text x={14} y={PT+ch/2} textAnchor="middle" fontSize="11" fill="#64748b" transform={`rotate(-90,14,${PT+ch/2})`}>avg |SHAP|</text>
      </svg>
      {tip && <div className="tooltip" style={{left:tip.x+12,top:tip.y}}>{tip.text}</div>}
    </div>
  );
}

            ))}

              <circle key={`${i}-${m}`} cx={sx(i)} cy={sy(r[m])} r="5" fill={modelColors[m]}

function MarkersPanel() {
  const [search, setSearch] = useState('');
  const [filterAct, setFilterAct] = useState('All');
  const [sortKey, setSortKey] = useState('contrib');
  const [sortAsc, setSortAsc] = useState(false);
  const filtered = useMemo(()=>{
    let d=[...TARGETS];
    if(search) d=d.filter(t=>t.gene.toLowerCase().includes(search.toLowerCase())||t.path.toLowerCase().includes(search.toLowerCase())||t.tx.toLowerCase().includes(search.toLowerCase()));
    if(filterAct!=='All') d=d.filter(t=>t.act===filterAct);
    d.sort((a,b)=>{
      const va=a[sortKey]??0, vb=b[sortKey]??0;
      if(typeof va==='number') return sortAsc?va-vb:vb-va;
      return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
    });
    return d;
  },[search,filterAct,sortKey,sortAsc]);
  const mkSort=(k)=>{if(sortKey===k)setSortAsc(!sortAsc);else{setSortKey(k);setSortAsc(false);}};
  const SortTh=({k,label})=>(
    <th className="text-left text-xs text-slate-400 font-semibold py-2 px-3 border-b border-slate-700 cursor-pointer hover:text-slate-200 select-none" onClick={()=>mkSort(k)}>
      {label}{sortKey===k?(sortAsc?' ↑':' ↓'):''}
    </th>
  );
  return (
    <div className="fade-in space-y-5">
      <SectionHeader title="Therapeutic Targets" subtitle="Gene-level MOFA+ weight × SHAP contribution scores with drug actionability"/>
      <div className="flex gap-3 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search gene, pathway, drug..."
          className="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 w-64"/>
        <div className="flex gap-2">
          {['All','Yes','Partial'].map(a=>(
            <button key={a} onClick={()=>setFilterAct(a)}
              className={`px-3 py-1.5 text-xs rounded-lg border transition-all ${filterAct===a?'bg-indigo-600 border-indigo-500 text-white':'border-slate-600 text-slate-400 hover:border-slate-400'}`}>{a==='All'?'All':'Actionable: '+a}</button>
          ))}
        </div>
        <span className="text-xs text-slate-500 self-center">{filtered.length} targets</span>
      </div>
      <div className="card overflow-hidden">
        <div className="overflow-x-auto" style={{maxHeight:480}}>
          <table>
            <thead>
              <tr>
                <SortTh k="gene" label="Gene"/>
                <SortTh k="mod" label="Modality"/>
                <SortTh k="contrib" label="SHAP Contrib."/>
                <SortTh k="nf" label="# Factors"/>
                <SortTh k="role" label="Role"/>
                <SortTh k="path" label="Pathway"/>
                <th className="text-left text-xs text-slate-400 font-semibold py-2 px-3 border-b border-slate-700">Therapeutic Strategy</th>
                <SortTh k="act" label="Actionable"/>
              </tr>
            </thead>
            <tbody>
              {filtered.map((t,i)=>(
                <tr key={i} className={t.act==='Yes'?'highlight-row':''}>
                  <td className="py-2 px-3 text-xs font-bold text-slate-200">{t.gene}</td>
                  <td className="py-2 px-3 text-xs text-slate-400">{t.mod}</td>
                  <td className="py-2 px-3 text-xs font-mono text-indigo-300">{t.contrib.toFixed(4)}</td>
                  <td className="py-2 px-3 text-xs text-center text-slate-300">{t.nf}</td>
                  <td className="py-2 px-3 text-xs text-slate-400">{t.role}</td>
                  <td className="py-2 px-3 text-xs text-slate-400">{t.path}</td>
                  <td className="py-2 px-3 text-xs text-slate-400 max-w-xs">{t.tx}</td>
                  <td className="py-2 px-3">
                    <span className={`badge ${t.act==='Yes'?'badge-yes':t.act==='Partial'?'badge-partial':'badge-no'}`}>{t.act}</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <div className="card p-4">
        <h3 className="text-sm font-semibold text-slate-300 mb-3">Contribution Score Distribution</h3>
        <BarChart data={TARGETS.slice(0,16)} xKey="gene" yKey="contrib" color="#6366f1" height={200} formatY={v=>v.toFixed(3)}/>
        <p className="text-xs text-slate-500 mt-2">Top 16 targets by combined SHAP contribution (|MOFA weight| × factor avg |SHAP|, summed across top-5 factors).</p>
      </div>
    </div>
  );
}

function FindingsPanel() {
  const [selFactor, setSelFactor] = useState('Factor8');
  const fb = FACTOR_BIOLOGY[selFactor];
  const therapeuticAxes = [
    {
      title:'Oncogene Inhibition',color:'#ef4444',
      entries:[
        {gene:'KRAS',drug:'Sotorasib (G12C); adagrasib; pan-KRAS PROTAC',status:'FDA approved (G12C)'},
        {gene:'BRAF',drug:'Dabrafenib + trametinib (V600E)',status:'FDA approved'},
        {gene:'EGFR',drug:'Osimertinib (3rd gen); erlotinib; afatinib',status:'FDA approved'},
        {gene:'PIK3CA',drug:'Alpelisib; capivasertib + fulvestrant',status:'FDA approved (breast)'},
        {gene:'IDH1',drug:'Ivosidenib (AG-120)',status:'FDA approved (AML, CCA)'},
        {gene:'JAK2',drug:'Ruxolitinib; fedratinib; pacritinib',status:'FDA approved (MF)'},
      ]
    },
    {
      title:'TSG Synthetic Lethality / Restoration',color:'#6366f1',
      entries:[
        {gene:'TP53',drug:'APR-246/eprenetapopt (p53 reactivator); AMG-232 (MDM2i)',status:'Phase III/II'},
        {gene:'ATRX',drug:'PARP inhibitors (olaparib) in ALT+ tumors',status:'Biomarker-guided'},
        {gene:'ARID1A',drug:'EZH2i (tazemetostat); HDAC/PARP combinations',status:'Phase II'},
        {gene:'PTEN',drug:'AKT inhibitors; ipatasertib; PI3K pathway',status:'Clinical trials'},
        {gene:'KMT2D',drug:'EZH2 inhibitors (tazemetostat)',status:'FDA approved (FL)'},
        {gene:'KMT2C',drug:'DOT1L inhibitors; epigenetic combos',status:'Preclinical/Phase I'},
      ]
    },
    {
      title:'Lineage Reprogramming / Immune',color:'#10b981',
      entries:[
        {gene:'CD274/PD-L1',drug:'Pembrolizumab; atezolizumab; durvalumab',status:'FDA approved (multiple)'},
        {gene:'PDCD1LG2',drug:'Anti-PD-1 axis antibodies (nivolumab)',status:'FDA approved'},
        {gene:'NECTIN4',drug:'Enfortumab vedotin (ADC)',status:'FDA approved (bladder)'},
        {gene:'IL33',drug:'Itepekimab (anti-IL-33 mAb); tezepelumab',status:'Phase II'},
        {gene:'GAS6/AXL',drug:'Bemcentinib (BGB324); AVB-S6-500',status:'Phase II'},
        {gene:'TP63',drug:'Squamous lineage reprogramming (experimental)',status:'Preclinical'},
      ]
    }
  ];
  return (
    <div className="fade-in space-y-6">
      <SectionHeader title="Main Findings & Implications" subtitle="Biological interpretation and therapeutic nominating from top MOFA+ factors"/>
      <div className="card p-5">
        <h3 className="text-sm font-semibold text-slate-300 mb-4">Factor Biology Cards</h3>
        <div className="flex gap-2 mb-5 flex-wrap">
          {SHAP_FACTORS.map(f=>(
            <button key={f.feature} onClick={()=>setSelFactor(f.feature)}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${selFactor===f.feature?'text-white border-transparent':'text-slate-400 border-slate-600 hover:border-slate-400'}`}
              style={selFactor===f.feature?{background:FACTOR_BIOLOGY[f.feature]?.color}:{}}>
              {f.feature}
            </button>
          ))}
        </div>
        {fb && (
          <div className="rounded-lg p-4" style={{background:`${fb.color}12`,border:`1px solid ${fb.color}33`}}>
            <div className="flex items-center gap-3 mb-3">
              <div className="w-3 h-3 rounded-full" style={{background:fb.color}}></div>
              <span className="font-bold text-slate-200">{selFactor}: {fb.title}</span>
              <span className="ml-auto text-xs font-mono text-slate-400">SHAP {fb.avgShap.toFixed(4)} · Var {(fb.varExp*100).toFixed(1)}%</span>
            </div>
            <p className="text-sm text-slate-300 leading-relaxed">{fb.narrative}</p>
            <div className="mt-3 flex gap-2 flex-wrap">
              <span className="text-xs text-slate-500">Key targets →</span>
              {fb.druggable.map(g=>(
                <span key={g} className="factor-tag text-xs" style={{background:`${fb.color}22`,color:fb.color,border:`1px solid ${fb.color}55`}}>{g}</span>
              ))}
            </div>
          </div>
        )}
      </div>
      <div className="space-y-4">
        <h3 className="text-sm font-semibold text-slate-300">Therapeutic Nomination by Axis</h3>
        {therapeuticAxes.map(({title,color,entries})=>(
          <div key={title} className="card p-5">
            <h4 className="text-sm font-bold mb-4" style={{color}}>{title}</h4>
            <div className="overflow-x-auto">
              <table>
                <thead>
                  <tr>
                    {['Gene','Drug / Mechanism','Clinical Status'].map(h=>(
                      <th key={h} className="text-left text-xs text-slate-500 font-semibold py-1.5 px-3 border-b border-slate-700">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {entries.map((e,i)=>(
                    <tr key={i}>
                      <td className="py-2 px-3 text-xs font-bold" style={{color}}>{e.gene}</td>
                      <td className="py-2 px-3 text-xs text-slate-300">{e.drug}</td>
                      <td className="py-2 px-3 text-xs">
                        <span className={`badge ${e.status.startsWith('FDA')?'badge-yes':e.status.startsWith('Phase')?'badge-partial':'badge-no'}`}>{e.status}</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        ))}
      </div>
      <div className="card p-5">
        <h3 className="text-sm font-semibold text-slate-300 mb-3">Cross-Cutting Conclusion</h3>
        <div className="space-y-3 text-sm text-slate-400 leading-relaxed">
          <p><strong className="text-slate-200">1. MOFA+ factors are prognostically superior to raw features.</strong> The five top factors distil millions of genomic measurements into interpretable biological programs, each with distinct therapeutic implications.</p>
          <p><strong className="text-slate-200">2. Factor8 defines pan-cancer vulnerability.</strong> Its high SHAP weight across all three models, despite low variance explained, indicates a dense convergence of oncogenic mutations (TP53/KRAS/APC/IDH1) with proteolytic invasion programs — a pan-cancer therapeutic sweet spot.</p>
          <p><strong className="text-slate-200">3. Factor6 nominating immune checkpoint therapy.</strong> The 9p24.1 amplicon (CD274/PD-L1, JAK2) detected in Factor6 directly identifies tumors most likely to respond to anti-PD-1/PD-L1 immunotherapy combined with JAK inhibitors.</p>
          <p><strong className="text-slate-200">4. Lineage identity factors guide lineage-directed therapy.</strong> Factor1 (squamous/TP63) and Factor15 (luminal/GATA3) establish tissue-of-origin programs that stratify chemotherapy sensitivity and direct lineage-specific ADC selection (enfortumab vedotin for squamous/NECTIN4+).</p>
          <p><strong className="text-slate-200">5. 13 actionable gene targets with existing drugs.</strong> Of the top therapeutic nominations, 13 genes map to approved or late-stage clinical agents, providing an immediate translational pipeline.</p>
        </div>
      </div>
    </div>
  );
}
