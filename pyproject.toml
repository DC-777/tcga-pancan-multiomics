[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tcga-pancan-multiomics"
version = "1.0.0"
description = "TCGA Pan-Cancer multiomics survival analysis using MOFA+ and gradient-boosting / transformer models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Debaditya Chakraborty", email = "debaditya.123@gmail.com" },
]
keywords = ["cancer", "multiomics", "survival-analysis", "MOFA", "TCGA", "SHAP"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.6",
  "lifelines>=0.29",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "torch>=2.0",
  "shap>=0.45",
  "mofapy2>=0.7",
  "umap-learn>=0.5",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "python-docx>=1.1",
  "requests>=2.30",
  "tqdm>=4.60",
]

[project.urls]
Homepage = "https://github.com/debaditya-chakraborty/tcga-pancan-multiomics"
Repository = "https://github.com/debaditya-chakraborty/tcga-pancan-multiomics"
Issues = "https://github.com/debaditya-chakraborty/tcga-pancan-multiomics/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."
